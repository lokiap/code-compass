# Retrieval benchmark on scikit-learn 1.5.2 (sklearn/ package, tests excluded).
# Each question lists one or more acceptable answers as "path::Symbol". A retrieved
# chunk is relevant if it comes from that file and overlaps the symbol's line range.
#
# category:
#   semantic - natural-language question, no code identifier (what a newcomer would type)
#   keyword  - mentions an identifier from the code base
