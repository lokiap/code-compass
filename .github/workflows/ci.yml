name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke test (index this repository and search it)
        run: |
          code-compass index . --index-dir /tmp/idx
          code-compass search "how is reciprocal rank fusion computed" --index-dir /tmp/idx -k 3 | tee /tmp/out.txt
          grep -q "HybridRetriever" /tmp/out.txt
