[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-compass"
version = "0.1.0"
description = "Ask questions about a large code base: AST-aware chunking, hybrid BM25 + embedding search on ChromaDB, measured retrieval quality."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Belkalai" }]
dependencies = [
  "chromadb>=1.0",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
st = ["sentence-transformers>=3"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
code-compass = "codecompass.cli:main"

[tool.setuptools]
packages = ["codecompass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
